<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Perseverance AI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --text-primary: #fafafa;
            --text-muted: #737373;
            --border-subtle: #1f1f1f;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            background-color: var(--bg-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2.5rem 1.5rem;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .error-container {
            max-width: 600px;
            padding: 3rem;
            background: rgba(17, 17, 17, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.125rem;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .logo-brace {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 300;
            color: #525252;
        }

        .logo-p {
            font-family: var(--font-sans);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
            color: var(--text-muted);
        }

        .btn {
            display: inline-block;
            background-color: var(--text-primary);
            color: var(--bg-primary);
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="logo">
            <span class="logo-brace">{</span>
            <span class="logo-p">P</span>
            <span class="logo-brace">}</span>
        </div>
        <h1>404</h1>
        <p>Sorry, the page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Return to Homepage</a>
    </div>
  <script src="assets/js/cookie-consent.js"></script>
</body>

</html>
